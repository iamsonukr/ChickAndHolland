<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order PDF</title>
<style>html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; display: block; }body { display: flex; flex-direction: column; } iframe { flex: 1; min-height: 0; } button { align-self: flex-end; margin: 6px 12px; padding: 6px 12px; }</style>
<body>
<div>
  <a id="download" hidden>Download PDF</a>
  <button id="share" type="button" hidden>Share PDF</button>
</div>
<p id="status" role="status">Opening PDF…</p>
<iframe name="orderDocument" title="Order PDF"></iframe>
<script>
  async function openPreview() {
    const params = new URLSearchParams(location.hash.slice(1));
    const source = new URL(params.get("source"));
    if (source.protocol !== "blob:" || source.origin !== location.origin) throw new Error();
    const response = await fetch(source);
    if (!response.ok) throw new Error();
    const file = new File([await response.blob()], params.get("name") || "order.pdf", {
      type: "application/pdf"
    });
    const url = URL.createObjectURL(file);
    const download = document.getElementById("download");
    download.href = url;
    download.download = file.name;
    download.hidden = false;
    const share = document.getElementById("share");
    const payload = { files: [file] };
    if (navigator.canShare?.(payload)) {
      share.hidden = false;
      share.onclick = async () => {
        try {
          await navigator.share(payload);
        } catch (error) {
          if (error.name !== "AbortError") download.click();
        }
      };
    }
    document.title = file.name;
    const displayName = file.name.split("#").map(part =>
      encodeURIComponent(part.replace(/\s+/g, "-"))
    ).join("#");
    history.replaceState(null, "", "/order-pdf/" + displayName);
    // Give the native viewer a named PDF response for its own Save button.
    const frame = document.querySelector("iframe");
    const form = document.createElement("form");
    form.method = "post";
    form.enctype = "multipart/form-data";
    form.action = "/order-pdf/" + encodeURIComponent(file.name);
    form.target = frame.name;
    form.hidden = true;
    const input = document.createElement("input");
    input.type = "file";
    input.name = "pdf";
    const transfer = new DataTransfer();
    transfer.items.add(file);
    input.files = transfer.files;
    form.append(input);
    document.body.append(form);
    form.submit();
    form.remove();
    document.getElementById("status").hidden = true;
  }
  openPreview().catch(() => {
    document.getElementById("status").textContent = "Open this PDF again from the order preview.";
  });
</script>
</body>
</html>
